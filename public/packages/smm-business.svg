    <!-- سطر مختلط (أرقام + عربي): بدون direction=rtl يعيد خوارزمية bidi ترتيبه
         فيلتصق كل رقم بالكلمة الخطأ. مع rtl يصبح text-anchor=start هو الحافة
         اليمنى، فيبقى المحاذاة كما هي. -->
    <text x="544" y="300" text-anchor="start" direction="rtl" font-family="'Tajawal','Cairo','Segoe UI',sans-serif" font-size="19" fill="#f8f7f4" opacity="0.75">4 منصات · 20 منشوراً</text>
    <text x="56" y="342" font-family="'Tajawal','Cairo','Segoe UI',sans-serif" font-size="17" fill="#f8f7f4" opacity="0.6">Selfah</text>

    <rect x="1" y="1" width="598" height="378" rx="28" fill="none" stroke="#d4af37" stroke-opacity="0.35" stroke-width="2"/>
