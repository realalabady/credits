      <stop offset="0" stop-color="#1a1815"/>
      <stop offset="1" stop-color="#2a2621"/>
    </linearGradient>
    <clipPath id="c1500"><rect width="600" height="380" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#c1500)">
    <rect width="600" height="380" fill="url(#bg1500)"/>
    <circle cx="520" cy="80" r="170" fill="#d4af37" opacity="0.07"/>

    <rect x="56" y="274" width="30" height="26" rx="6" fill="#e3c46a" stroke="#d4af37" stroke-opacity="0" stroke-width="2"/>
    <rect x="102" y="258" width="30" height="42" rx="6" fill="#e3c46a" stroke="#d4af37" stroke-opacity="0" stroke-width="2"/>
    <rect x="148" y="242" width="30" height="58" rx="6" fill="#e3c46a" stroke="#d4af37" stroke-opacity="0" stroke-width="2"/>
    <rect x="194" y="226" width="30" height="74" rx="6" fill="#e3c46a" stroke="#d4af37" stroke-opacity="0" stroke-width="2"/>
    <rect x="240" y="210" width="30" height="90" rx="6" fill="none" stroke="#d4af37" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="286" y="194" width="30" height="106" rx="6" fill="none" stroke="#d4af37" stroke-opacity="0.35" stroke-width="2"/>

    <text x="544" y="80" text-anchor="end" font-family="'Tajawal','Cairo','Segoe UI',sans-serif" font-size="34" font-weight="800" fill="#f8f7f4">باقة الأعمال</text>
    <text x="544" y="116" text-anchor="end" font-family="'Tajawal','Cairo','Segoe UI',sans-serif" font-size="20" fill="#e3c46a">إدارة حسابات التواصل</text>

    <text x="544" y="214" text-anchor="end" font-family="'Tajawal','Cairo','Segoe UI',sans-serif" font-size="66" font-weight="800" fill="#f8f7f4">1500</text>
